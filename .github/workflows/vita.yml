# Builds WoWVita.vpk (and the network test netcheck.vpk) with the VitaSDK Docker image.
# The VPKs are attached to the run as the "WoWVita-vpk" artifact (Actions -> the run -> Artifacts).
name: Vita build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# one build at a time: a newer push cancels the older run, so the builds branch always gets the newest VPK
concurrency:
  group: vita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache git cmake make python3 bash
          else apt-get update && apt-get install -y git cmake make python3; fi
      - uses: actions/checkout@v4
      - name: Vita libraries
        run: |
          # the image usually has every vdpm package; install the ones the client links if one is missing
          for p in vitaGL vitaShaRK mathneon SceShaccCgExt taihen; do
            ls "$VITASDK"/arm-vita-eabi/lib | grep -qi "$p" || vdpm "$p" || true
          done
      - name: WoWVita.vpk
        shell: bash
        run: |
          cmake -S . -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          set -o pipefail
          cmake --build build-vita -j"$(nproc)" -- -k 2>&1 | tee build-vita.log
          test -f build-vita/WoWVita.vpk
      - name: netcheck.vpk
        run: |
          cmake -S netcheck -B build-net -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake
          cmake --build build-net -j"$(nproc)"
          cp build-net/w3dlogin.vpk build-net/netcheck.vpk
      - name: Publish to the builds branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the latest VPKs on an orphan "builds" branch (one commit, force-pushed): easy to fetch with git
          mkdir -p /tmp/out && cp build-vita/WoWVita.vpk build-net/netcheck.vpk /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b builds && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "VPKs of ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" builds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WoWVita-vpk
          path: |
            build-vita/WoWVita.vpk
            build-net/netcheck.vpk
            build-vita.log
          if-no-files-found: warn
